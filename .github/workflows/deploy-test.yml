name: Deploy naar testomgeving

# Push naar de dev-branch (of handmatig) -> build + deploy via SSH/rsync.
# Voorlopig handmatig (Actions -> Deploy naar testomgeving -> Run workflow),
# zodat er geen falende runs zijn vóór de server-secrets bestaan.
# Zet de push-trigger aan zodra de secrets ingesteld zijn.
on:
  workflow_dispatch:
  # push:
  #   branches: [claude/admiring-fermat-g5nlss]

concurrency:
  group: deploy-test
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP opzetten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, intl, mbstring, pdo_mysql, gd, zip, xml, fileinfo, exif
          tools: composer:v2

      - name: Composer install
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      # Assets (frontend + admin) zijn voorlopig mee-gecommit in public/build,
      # dus geen webpack-stap nodig. Voor productie: hier `npm ci && npm run build`.

      - name: SSH voorbereiden (wachtwoord of sleutel)
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          if [ -n "${{ secrets.SSH_PASSWORD }}" ]; then
            echo "Auth-methode: wachtwoord (sshpass)."
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          else
            echo "Auth-methode: privé-sleutel."
            KEY="${{ secrets.SSH_KEY }}"
            if printf '%s' "$KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/id_deploy 2>/dev/null \
                 && head -1 ~/.ssh/id_deploy | grep -q "PRIVATE KEY"; then
              echo "Sleutel via base64 gedecodeerd."
            else
              printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/id_deploy
              echo "Sleutel als platte tekst geschreven."
            fi
            chmod 600 ~/.ssh/id_deploy
            ssh-keygen -y -f ~/.ssh/id_deploy >/dev/null 2>&1 \
              && echo "✓ Privé-sleutel is geldig." \
              || echo "!! Privé-sleutel ONGELDIG — controleer de SSH_KEY secret."
          fi

      - name: Rsync naar server (in-place in de docroot)
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          if [ -n "${{ secrets.SSH_PASSWORD }}" ]; then
            RSH="sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=20 -o ServerAliveCountMax=60"
          else
            RSH="ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=20 -o ServerAliveCountMax=60"
          fi
          rsync -az --delete --no-perms --omit-dir-times --ignore-errors \
            --exclude='.git' --exclude='node_modules' \
            --exclude='var' --exclude='.env.local' \
            --exclude='upload' --exclude='public/uploads' \
            --exclude='.nfs*' \
            -e "$RSH" \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:acs/" || true

      - name: Remote deploy-stappen (migraties, seed, cache)
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          if [ -n "${{ secrets.SSH_PASSWORD }}" ]; then
            RSH="sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=20 -o ServerAliveCountMax=60"
          else
            RSH="ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=20 -o ServerAliveCountMax=60"
          fi
          $RSH "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "DEPLOY_PATH='acs' PHP_BIN='${{ secrets.PHP_BIN }}' bash -s" < deploy/remote-deploy.sh

      - name: Site healthcheck (live verificatie)
        continue-on-error: true
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          BASE="${{ secrets.SITE_URL }}"
          if [ -z "$BASE" ]; then BASE="https://goldeneye.digital"; fi
          echo "=== BEELD-FETCH TEST (runner -> acs.be, browser-UA) ==="
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          for u in "https://www.acs.be/upload/files/page-block/13/header-img.jpg" "https://www.acsac.eu/upload/files/page-block/13/header-img.jpg"; do
            code=$(curl -s -o /tmp/img -A "$UA" -w "%{http_code} %{content_type}" --max-time 25 "$u" || echo "000")
            echo "runner -> $u : $code  (bytes=$(wc -c </tmp/img 2>/dev/null))"
          done
          echo "Healthcheck op $BASE"
          for path in "/" "/admin/" "/build/css/app.css" "/onze-expertise"; do
            code=$(curl -k -s -o /tmp/body -w "%{http_code}" -L --max-time 30 "$BASE$path" || echo "000")
            echo ">>> $BASE$path -> HTTP $code  (bytes=$(wc -c < /tmp/body))"
            if [ "$code" != "200" ] && [ "$code" != "302" ]; then
              echo "--- eerste 800 tekens response ---"; head -c 800 /tmp/body; echo; echo "---"
            fi
          done
          echo "===== BEELD-CHECK (uploads/ urls in de pagina) ====="
          set +e
          CB="cb=$(date +%s)$RANDOM"   # cache-buster om reverse-proxy te omzeilen
          for path in "/" "/profielen/ondernemer" "/onze-expertise" "/kerncijfers"; do
            HTML=$(curl -k -s -L --max-time 30 -H 'Cache-Control: no-cache' "$BASE$path?$CB")
            bytes=$(printf '%s' "$HTML" | wc -c)
            up=$(printf '%s' "$HTML" | grep -o '/uploads/[a-zA-Z0-9/_.-]*' | sort -u | head -4 | tr '\n' ' ')
            upcount=$(printf '%s' "$HTML" | grep -oc '/uploads/')
            h1=$(printf '%s' "$HTML" | grep -o '<h1[^>]*>[^<]*' | head -1)
            echo ">>> $path  bytes=$bytes  uploads-refs=$upcount"
            echo "    img : ${up:-<GEEN /uploads/ url gevonden>}"
            echo "    h1  : ${h1:-<geen h1>}"
          done
          echo "===== EINDE BEELD-CHECK ====="
          # Ook server-side checken (logs + php-versie), onafhankelijk van DNS.
          if [ -n "${{ secrets.SSH_PASSWORD }}" ]; then
            RSH="sshpass -e ssh -o StrictHostKeyChecking=accept-new"
          else
            RSH="ssh -i ~/.ssh/id_deploy"
          fi
          $RSH "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "PHP_BIN='${{ secrets.PHP_BIN }}' DEPLOY_PATH='acs' bash -s" <<'EOF'
          set +e
          PHP="${PHP_BIN:-php}"
          BASE="$(dirname "$DEPLOY_PATH")"
          WWW="$BASE/www"
          WBA="$BASE/www_before_autogit"
          echo "BASE=$BASE  DEPLOY_PATH=$DEPLOY_PATH"
          echo "=== www VOOR ==="; ls -ld "$WWW" 2>&1; readlink "$WWW" 2>&1
          # Probeer www -> public te zetten (verbose, met foutmelding).
          rm -f "$WWW"; echo "rm www exit=$?"
          ln -s "$DEPLOY_PATH/public" "$WWW"; echo "ln www exit=$?"
          echo "=== www NA ==="; ls -ld "$WWW" 2>&1; readlink "$WWW" 2>&1
          # Lokale webserver-test met juiste Host-header (omzeilt DNS/cache).
          echo "=== lokale curl (Host: goldeneye.digital) ==="
          for u in / /admin/ /build/css/app.css; do
            for scheme in http https; do
              c=$(curl -k -s -o /dev/null -w '%{http_code}' --max-time 15 -H 'Host: goldeneye.digital' "$scheme://127.0.0.1$u" 2>/dev/null)
              echo "$scheme://127.0.0.1$u -> $c"
            done
          done
          echo "=== var/*.json op server ==="; ls -la "$DEPLOY_PATH/var/"*.json 2>&1
          echo "--- scraped-heroes.json (eerste 200) ---"; head -c 200 "$DEPLOY_PATH/var/scraped-heroes.json" 2>&1; echo
          echo "--- block-images.json (eerste 200) ---"; head -c 200 "$DEPLOY_PATH/var/block-images.json" 2>&1; echo
          echo "--- aantal scraped-bestanden ---"; ls "$DEPLOY_PATH/public/uploads/scraped/" 2>/dev/null | wc -l
          echo "--- homepage header-block legacy_id + scraped_hero test ---"
          $PHP "$DEPLOY_PATH/bin/console" debug:twig 2>/dev/null | grep -i block_images || echo "(block_images functie niet gevonden in twig)"
          echo "=== bevat live homepage een menu-item? ==="; curl -k -s -L --max-time 20 "https://goldeneye.digital/" | grep -c "main-nav__item" || echo 0
          echo "=== homepage header style-attribuut (bg) ==="; curl -k -s -L --max-time 20 "https://goldeneye.digital/" | grep -oE 'header__video-container[^>]{0,160}' | head -1
          echo "=== inhoud www_before_autogit ==="; ls -la "$WBA" 2>&1 | head
          echo "=== autogit config ==="; cat "$BASE/autogit.yml" 2>/dev/null || echo "(geen autogit.yml)"; cat "$BASE/.webhosting/"* 2>/dev/null | head -40
          EOF
